# Push to main → pack on Actions runner → SCP to server → deploy/update.sh
# Server does NOT need to git fetch GitHub (avoids CN network "Empty reply" issues).
#
# Required GitHub Secrets (repo Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      server IP or hostname
#   DEPLOY_USER      SSH user (e.g. root)
#   DEPLOY_PASSWORD  SSH password
# Optional:
#   DEPLOY_PORT      default 22
#   DEPLOY_PATH      default /root/Vibe-Research-main
#   NOTIFY_EMAIL     更新成功后收件人
#   SMTP_USER        发件邮箱 (QQ 填完整地址, 如 you@qq.com)
#   SMTP_PASS        QQ 邮箱授权码, 不是登录密码
#   SMTP_HOST        default smtp.qq.com
#   SMTP_PORT        default 465
#   SMTP_FROM        default SMTP_USER

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_npm_ci:
        description: "Skip npm ci (faster; use when lockfile unchanged)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          ok=1
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "::error::DEPLOY_HOST is empty."
            ok=0
          else
            echo "DEPLOY_HOST is set (len=${#DEPLOY_HOST})"
          fi
          if [ -z "${DEPLOY_USER}" ]; then
            echo "::error::DEPLOY_USER is empty."
            ok=0
          else
            echo "DEPLOY_USER is set"
          fi
          if [ -z "${DEPLOY_PASSWORD}" ]; then
            echo "::error::DEPLOY_PASSWORD is empty."
            ok=0
          else
            echo "DEPLOY_PASSWORD is set (len=${#DEPLOY_PASSWORD})"
          fi
          [ "$ok" = "1" ]

      - name: Checkout
        uses: actions/checkout@v5

      - name: Pack release (keep server .env)
        run: |
          set -euo pipefail
          # Write outside workspace first (tar of "." fails if output grows inside the tree),
          # then copy in for scp-action (Docker only sees GITHUB_WORKSPACE).
          OUT="${RUNNER_TEMP}/vibe-deploy.tgz"
          tar -C "${GITHUB_WORKSPACE}" -czf "$OUT" \
            --exclude='./.git' \
            --exclude='./vibe-deploy.tgz' \
            --exclude='./frontend/node_modules' \
            --exclude='./frontend/dist' \
            --exclude='./backend/.venv' \
            --exclude='./backend/.env' \
            --exclude='./backend/**/__pycache__' \
            --exclude='./.cursor' \
            .
          cp -f "$OUT" "${GITHUB_WORKSPACE}/vibe-deploy.tgz"
          ls -lh vibe-deploy.tgz

      - name: Upload tarball
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: vibe-deploy.tgz
          target: /tmp/
          overwrite: true

      - name: Extract and update
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 40m
          envs: DEPLOY_PATH,NO_NPM_CI
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:${PATH:-}"
            if [[ -f /root/miniconda3/etc/profile.d/conda.sh ]]; then
              # shellcheck disable=SC1091
              source /root/miniconda3/etc/profile.d/conda.sh
              conda activate base >/dev/null 2>&1 || true
            fi
            ROOT="${DEPLOY_PATH:-/root/Vibe-Research-main}"
            mkdir -p "$ROOT"
            # Preserve local secrets / data
            if [[ -f "$ROOT/backend/.env" ]]; then
              cp -a "$ROOT/backend/.env" /tmp/vibe.env.bak
            fi
            STAGE="/tmp/vibe-extract-$$"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            tar -xzf /tmp/vibe-deploy.tgz -C "$STAGE"
            # Overlay tar never deletes; drop source files removed in this release.
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude '/backend/.env' \
                --exclude '/backend/.venv/' \
                --exclude '/backend/.cache/' \
                --exclude '/backend/.pytest_cache/' \
                --exclude '/frontend/node_modules/' \
                --exclude '/frontend/dist/' \
                --exclude '/.git/' \
                "$STAGE/" "$ROOT/"
            else
              tar -xzf /tmp/vibe-deploy.tgz -C "$ROOT"
              rm -f "$ROOT/frontend/src/pages/Weather.tsx" "$ROOT/backend/weather.py"
            fi
            rm -rf "$STAGE"
            if [[ -f /tmp/vibe.env.bak ]]; then
              mkdir -p "$ROOT/backend"
              cp -a /tmp/vibe.env.bak "$ROOT/backend/.env"
            fi
            cd "$ROOT"
            echo "[deploy] extracted to $ROOT"
            sed -i 's/\r$//' deploy/*.sh 2>/dev/null || true
            chmod +x deploy/*.sh 2>/dev/null || true
            if [[ "${NO_NPM_CI:-false}" == "true" ]]; then
              bash deploy/update.sh --no-npm-ci
            else
              bash deploy/update.sh
            fi
            rm -f /tmp/vibe-deploy.tgz /tmp/vibe.env.bak
            echo "[deploy] done"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NO_NPM_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.no_npm_ci || false }}

      - name: Deploy meta
        if: success()
        id: meta
        run: |
          set -euo pipefail
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ver=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Email after successful deploy
        if: ${{ success() && secrets.NOTIFY_EMAIL != '' && secrets.SMTP_USER != '' && secrets.SMTP_PASS != '' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST || 'smtp.qq.com' }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ (secrets.SMTP_PORT || '465') == '465' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Vibe-Research <${{ secrets.SMTP_FROM || secrets.SMTP_USER }}>
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: Vibe-Research v${{ steps.meta.outputs.ver }} 服务器更新成功 (${{ steps.meta.outputs.short }})
          convert_markdown: true
          body: |
            生产环境已更新成功。

            - 版本: ${{ steps.meta.outputs.ver }}
            - 仓库: ${{ github.repository }}
            - 提交: ${{ github.sha }}
            - 说明: ${{ github.event.head_commit.message || 'workflow_dispatch' }}
            - 触发: ${{ github.event_name }} / ${{ github.actor }}
            - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            打开站点确认即可。
