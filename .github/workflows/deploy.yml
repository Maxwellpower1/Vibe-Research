# Push to main → SSH into production → git pull + deploy/update.sh
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      server IP or hostname
#   DEPLOY_USER      SSH user (e.g. root)
#   DEPLOY_PASSWORD  SSH password
# Optional:
#   DEPLOY_PORT      default 22
#   DEPLOY_PATH      default /root/Vibe-Research-main

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_npm_ci:
        description: "Skip npm ci (faster; use when lockfile unchanged)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          envs: DEPLOY_PATH,NO_NPM_CI
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:${PATH:-}"
            # conda python on PATH for ad-hoc checks (systemd uses absolute path)
            if [[ -f /root/miniconda3/etc/profile.d/conda.sh ]]; then
              # shellcheck disable=SC1091
              source /root/miniconda3/etc/profile.d/conda.sh
              conda activate base >/dev/null 2>&1 || true
            fi
            ROOT="${DEPLOY_PATH:-/root/Vibe-Research-main}"
            cd "$ROOT"
            if [[ ! -d .git ]]; then
              echo "[deploy] FATAL: $ROOT is not a git repo."
              echo "[deploy] On server run: see deploy/README.md (convert zip dir → git clone)"
              exit 1
            fi
            echo "[deploy] $(hostname) $(pwd) $(git rev-parse --short HEAD) → fetching"
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            echo "[deploy] now at $(git rev-parse --short HEAD) $(git log -1 --oneline)"
            sed -i 's/\r$//' deploy/*.sh 2>/dev/null || true
            chmod +x deploy/*.sh 2>/dev/null || true
            if [[ "${NO_NPM_CI:-false}" == "true" ]]; then
              bash deploy/update.sh --no-npm-ci
            else
              bash deploy/update.sh
            fi
            echo "[deploy] done"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NO_NPM_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.no_npm_ci || false }}
