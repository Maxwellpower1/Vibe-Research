# Push to main → pack on Actions runner → SCP to server → deploy/update.sh
# Server does NOT need to git fetch GitHub (avoids CN network "Empty reply" issues).
#
# Required GitHub Secrets (repo Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      server IP or hostname
#   DEPLOY_USER      SSH user (e.g. root)
#   DEPLOY_PASSWORD  SSH password
# Optional:
#   DEPLOY_PORT      default 22
#   DEPLOY_PATH      default /root/Vibe-Research-main

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_npm_ci:
        description: "Skip npm ci (faster; use when lockfile unchanged)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          ok=1
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "::error::DEPLOY_HOST is empty."
            ok=0
          else
            echo "DEPLOY_HOST is set (len=${#DEPLOY_HOST})"
          fi
          if [ -z "${DEPLOY_USER}" ]; then
            echo "::error::DEPLOY_USER is empty."
            ok=0
          else
            echo "DEPLOY_USER is set"
          fi
          if [ -z "${DEPLOY_PASSWORD}" ]; then
            echo "::error::DEPLOY_PASSWORD is empty."
            ok=0
          else
            echo "DEPLOY_PASSWORD is set (len=${#DEPLOY_PASSWORD})"
          fi
          [ "$ok" = "1" ]

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack release (keep server .env)
        run: |
          set -euo pipefail
          # Must live under $GITHUB_WORKSPACE: scp-action runs in Docker and cannot see host /tmp
          tar -czf vibe-deploy.tgz \
            --exclude='./.git' \
            --exclude='./vibe-deploy.tgz' \
            --exclude='./frontend/node_modules' \
            --exclude='./frontend/dist' \
            --exclude='./backend/.venv' \
            --exclude='./backend/.env' \
            --exclude='./backend/**/__pycache__' \
            --exclude='./.cursor' \
            .
          ls -lh vibe-deploy.tgz

      - name: Upload tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: vibe-deploy.tgz
          target: /tmp/
          overwrite: true

      - name: Extract and update
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 40m
          envs: DEPLOY_PATH,NO_NPM_CI
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:${PATH:-}"
            if [[ -f /root/miniconda3/etc/profile.d/conda.sh ]]; then
              # shellcheck disable=SC1091
              source /root/miniconda3/etc/profile.d/conda.sh
              conda activate base >/dev/null 2>&1 || true
            fi
            ROOT="${DEPLOY_PATH:-/root/Vibe-Research-main}"
            mkdir -p "$ROOT"
            # Preserve local secrets / data
            if [[ -f "$ROOT/backend/.env" ]]; then
              cp -a "$ROOT/backend/.env" /tmp/vibe.env.bak
            fi
            tar -xzf /tmp/vibe-deploy.tgz -C "$ROOT"
            if [[ -f /tmp/vibe.env.bak ]]; then
              mkdir -p "$ROOT/backend"
              cp -a /tmp/vibe.env.bak "$ROOT/backend/.env"
            fi
            cd "$ROOT"
            echo "[deploy] extracted to $ROOT"
            sed -i 's/\r$//' deploy/*.sh 2>/dev/null || true
            chmod +x deploy/*.sh 2>/dev/null || true
            if [[ "${NO_NPM_CI:-false}" == "true" ]]; then
              bash deploy/update.sh --no-npm-ci
            else
              bash deploy/update.sh
            fi
            rm -f /tmp/vibe-deploy.tgz /tmp/vibe.env.bak
            echo "[deploy] done"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NO_NPM_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.no_npm_ci || false }}
